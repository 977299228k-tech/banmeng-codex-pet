<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BANMENG Codex Pet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="pet-shell" id="petShell" data-mode="idle" data-motion="idle" data-facing="left">
      <section class="status-panel" aria-live="polite">
        <div class="status-copy">
          <span class="status-kicker" id="statusKicker">CODEX · READY</span>
          <strong id="statusTitle">待命中</strong>
          <span id="statusDetail">随时可以开始</span>
          <span class="task-meta" id="taskMeta">没有进行中的任务</span>
        </div>
        <button class="quota-ring" id="quotaRing" type="button" title="刷新额度">
          <span class="quota-value" id="quotaValue">--</span>
          <span class="quota-label">剩余</span>
        </button>
        <div class="quota-detail">
          <span id="resetTime">正在连接额度</span>
          <span id="usageSummary">ChatGPT</span>
        </div>
        <div class="life-strip" aria-label="桌宠状态">
          <button class="life-stat life-stat-satiety" id="feedButton" type="button" title="点击喂食">
            <span class="life-name">饱食</span>
            <strong id="satietyValue">--</strong>
            <span class="life-action">喂食</span>
            <span class="life-track" aria-hidden="true"><i id="satietyFill"></i></span>
          </button>
          <button class="life-stat life-stat-mood" id="playButton" type="button" title="点击陪玩">
            <span class="life-name">心情</span>
            <strong id="moodValue">--</strong>
            <span class="life-action">陪玩</span>
            <span class="life-track" aria-hidden="true"><i id="moodFill"></i></span>
          </button>
        </div>
      </section>
      <div class="character-wrap" id="characterWrap" role="button" aria-label="Codex 桌宠">
        <div class="reaction-bubble" id="reactionBubble" role="status"></div>
        <div class="activity-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="heart-burst" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="character-flip" id="characterFlip">
          <img class="character" src="../assets/codex-pet.png" alt="白发 Codex 桌宠" draggable="false" />
        </div>
        <div class="ground-shadow" aria-hidden="true"></div>
      </div>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
